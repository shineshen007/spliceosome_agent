[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spliceosome-agent"
version = "0.1.2"
description = "Auditable, approval-gated multi-agent spliceosome screening"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Xia Shen" }]
keywords = ["bioinformatics", "spliceosome", "differential-expression", "multi-agent", "reproducibility"]
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: R",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "pydantic>=2.10,<3", "PyYAML>=6,<7", "pandas>=2.2,<3",
  "numpy>=1.26,<3", "httpx>=0.28,<1", "textual>=1,<9",
  "langgraph>=1,<2", "langgraph-checkpoint-sqlite>=3,<4",
  "platformdirs>=4,<5", "psutil>=6,<8", "matplotlib>=3.8,<4",
  "keyring>=25,<26",
]

[project.urls]
Homepage = "https://github.com/shineshen007/spliceosome_agent"
Issues = "https://github.com/shineshen007/spliceosome_agent/issues"


[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "build>=1,<2"]

[project.scripts]
spliceosome-agent = "spliceosome_agent.cli:main"
spliceosome_agent = "spliceosome_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
spliceosome_agent = ["resources/*.md", "resources/*.json", "resources/*.tcss", "resources/r/*.R", "resources/r/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests_agent"]
asyncio_mode = "auto"
markers = [
  "requires_r: needs the locked R library (jsonlite, limma, DESeq2); skipped automatically when absent",
]
